# Netlify production deploy configuration
# Vite SPA — client-side routing (wouter) requires the fallback redirect.

[build]
  command = "npm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: serve index.html for any unknown path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
